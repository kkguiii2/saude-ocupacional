# ==========================================
# SAÚDE OCUPACIONAL - CONFIGURAÇÃO
# ==========================================

# -----------------------------------------------------------
# BANCO DE DADOS (PostgreSQL)
# Prioridade: SPRING_DATASOURCE_URL (Docker Compose)
#             → fallback: DB_HOST/DB_PORT/DB_NAME (legado .env)
# NUNCA use localhost como host do banco em Docker!
# -----------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:saude_ocupacional}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:micro123}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# -----------------------------------------------------------
# JPA / HIBERNATE
# -----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# -----------------------------------------------------------
# SERVIDOR
# 0.0.0.0 = aceita conexões de qualquer interface de rede
# Necessário para acesso via IP na rede local
# -----------------------------------------------------------
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}
server.compression.enabled=true

# -----------------------------------------------------------
# THYMELEAF (Templates)
# -----------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# -----------------------------------------------------------
# JWT - SEGURANÇA
# IMPORTANTE: Em produção, defina JWT_SECRET como variável de ambiente!
# -----------------------------------------------------------
jwt.secret=${JWT_SECRET:saudeOcupacionalSuperSecretKey2024Minimo32Caracteres!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# -----------------------------------------------------------
# CORS — Permite acesso de qualquer origem (necessário para rede local)
# Para restringir, use: CORS_ORIGINS=http://192.168.X.X:8080,http://localhost:8080
# -----------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:*}

# -----------------------------------------------------------
# ATUATOR (Health Check)
# -----------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# -----------------------------------------------------------
# LOGGING
# -----------------------------------------------------------
logging.level.com.industrial.saude=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.engine.jdbc.batch=ERROR