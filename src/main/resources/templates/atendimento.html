<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atendimento - Saúde Ocupacional</title>
    <link rel="stylesheet" th:href="@{/css/design-system.css}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { opacity: 0; animation: pageFade 0.3s ease-out forwards; }
        @keyframes pageFade { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-100">
    <div class="app-layout">
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 lg:hidden hidden" onclick="toggleSidebar()"></div>
        
        <aside id="sidebar" class="sidebar sidebar-transition fixed z-50">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <div class="sidebar-brand-icon">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                    </div>
                    <div class="whitespace-nowrap">
                        <div class="sidebar-brand-text">Saúde</div>
                        <div class="sidebar-brand-subtitle">Ocupacional</div>
                    </div>
                </div>
            </div>
            <nav class="sidebar-nav">
                <div class="sidebar-nav-section">
                    <a href="/dashboard" class="sidebar-nav-link"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg><span class="whitespace-nowrap">Dashboard</span></a>
                    <a href="/colaboradores" class="sidebar-nav-link"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg><span class="whitespace-nowrap">Colaboradores</span></a>
                    <a href="/atendimento" class="sidebar-nav-link active"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><span class="whitespace-nowrap">Atendimentos</span></a>
                    <a href="/acidentes" class="sidebar-nav-link"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg><span class="whitespace-nowrap">Acidentes</span></a>
                    <a href="/agendamentos" class="sidebar-nav-link"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><span class="whitespace-nowrap">Agendamentos</span></a>
                    <a href="/estoque" class="sidebar-nav-link"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg><span class="whitespace-nowrap">Estoque</span></a>
                    <a href="/relatorios" class="sidebar-nav-link"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><span class="whitespace-nowrap">Relatórios</span></a>

                </div>
            </nav>
            <div class="sidebar-footer"><div class="sidebar-footer-text"></div></div>
        </aside>
        
        <main class="main-content">
            <header class="app-header">
                <div class="flex items-center gap-4">
                    <button onclick="toggleSidebar()" class="lg:hidden header-icon-btn"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
                    <button onclick="toggleCollapse()" class="hidden lg:block header-icon-btn" title="Colapsar"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
                    <div><h1 class="text-lg font-semibold text-slate-800">Atendimentos</h1><p class="text-sm text-slate-500">Atendimentos de hoje</p></div>
                </div>
                <div class="app-header-right">
                    <button onclick="logout()" class="header-icon-btn" title="Sair"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg></button>
                </div>
            </header>
            
            <div class="content-area space-y-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Atendimentos de Hoje</h2>
                        <button onclick="showModal('modal-atendimento')" class="btn btn-success btn-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                            Novo Atendimento
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="search-bar">
                            <input type="text" id="search-matricula" class="search-input" placeholder="Buscar por matrícula...">
                            <button onclick="buscarColaborador()" class="btn btn-secondary">Buscar</button>
                        </div>
                        <div class="table-container">
                            <table class="data-table">
                                <thead><tr><th>Data/Hora</th><th>Colaborador</th><th>Matrícula</th><th>Tipo</th><th>Gravidade</th><th>Emergência</th><th>Encaminhamento</th></tr></thead>
                                <tbody id="tabela-atendimentos"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                
                <div class="card border-l-4 border-l-red-500">
                    <div class="card-header bg-red-50">
                        <h2 class="card-title text-red-600">Emergências</h2>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table">
                                <thead><tr><th>Data/Hora</th><th>Colaborador</th><th>Sintomas</th><th>Gravidade</th></tr></thead>
                                <tbody id="tabela-emergencias"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Modal -->
    <div id="modal-atendimento" class="modal-overlay">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h2 class="modal-title">Novo Atendimento</h2>
                <button onclick="hideModal('modal-atendimento')" class="modal-close"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            <div class="modal-body">
                <form id="form-atendimento" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-group">
                            <label class="form-label">Data/Hora</label>
                            <input type="datetime-local" id="atend-data" required class="form-input">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Matrícula do Colaborador</label>
                            <input type="text" id="atend-colab-matricula" required class="form-input" placeholder="Digite a matrícula">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tipo de Atendimento</label>
                        <select id="atend-tipo" required class="form-input">
                            <option value="CONSULTA_ROTINA">Consulta Rotina</option>
                            <option value="EMERGENCIA">Emergência</option>
                            <option value="ACIDENTE_TRABALHO">Acidente de Trabalho</option>
                            <option value="RETORNO_TRABALHO">Retorno ao Trabalho</option>
                            <option value="EXAME_PERIODICO">Exame Periódico</option>
                            <option value="AVALIACAO_CLINICA">Avaliação Clínica</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Sintomas</label>
                        <textarea id="atend-sintomas" rows="3" class="form-input"></textarea>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-group">
                            <label class="form-label">Gravidade</label>
                            <select id="atend-gravidade" required class="form-input">
                                <option value="LEVE">Leve</option>
                                <option value="MODERADA">Moderada</option>
                                <option value="GRAVE">Grave</option>
                                <option value="CRITICA">Crítica</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Conduta</label>
                            <textarea id="atend-conduta" rows="2" class="form-input"></textarea>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Encaminhamento</label>
                        <select id="atend-encaminhamento" class="form-input">
                            <option value="">Nenhum</option>
                            <option value="RETORNO_TRABALHO">Retorno ao Trabalho</option>
                            <option value="AFASTAMENTO">Afastamento</option>
                            <option value="ENCAMINHAMENTO_HOSPITAL">Encaminhamento Hospitalar</option>
                            <option value="ACOMPANHAMENTO_AMBULATORIO">Acomp. Ambulatório</option>
                        </select>
                    </div>
                    <div class="pt-4"><button type="submit" id="btn-registrar-atendimento" class="btn btn-primary btn-block">Registrar</button></div>
                </form>
            </div>
        </div>
    </div>
    
    <script th:src="@{/js/app.js}"></script>
    <script>
        let collapsed = false;
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); }
        function toggleCollapse() { const sidebar = document.getElementById('sidebar'); const mainContent = document.querySelector('.main-content'); collapsed = !collapsed; sidebar.classList.toggle('collapsed'); mainContent.style.marginLeft = collapsed ? '80px' : '280px'; }
        function showModal(id) { document.getElementById(id).classList.add('active'); }
        function hideModal(id) { document.getElementById(id).classList.remove('active'); }
        
        async function loadAtendimentos() {
            try {
                const data = await Atendimentos.getHoje();
                console.log('loadAtendimentos: dados recebidos:', data);
                const tbody = document.getElementById('tabela-atendimentos');
                tbody.innerHTML = '';
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-slate-500">Nenhum atendimento hoje</td></tr>';
                    return;
                }
                data.forEach(a => {
                    const gravidadeClass = a.gravidade === 'CRITICA' ? 'badge-danger' : a.gravidade === 'GRAVE' ? 'badge-warning' : 'badge-success';
                    const dataHora = a.dataHora ? new Date(a.dataHora).toLocaleString('pt-BR') : '-';
                    tbody.innerHTML += `<tr>
                        <td class="font-medium text-slate-700">${dataHora}</td>
                        <td class="text-slate-600">${a.colaboradorNome}</td>
                        <td class="text-slate-600">${a.colaboradorMatricula}</td>
                        <td class="text-slate-600">${a.tipo}</td>
                        <td><span class="badge ${gravidadeClass}">${a.gravidade}</span></td>
                        <td>${a.emergencia ? '<span class="badge badge-danger">SIM</span>' : '-'}</td>
                        <td class="text-slate-600">${a.encaminhamento || '-'}</td>
                    </tr>`;
                });
            } catch (err) {
                console.error('Erro ao carregar atendimentos:', err);
            }
        }
        
        async function loadEmergencias() {
            try {
                const data = await Atendimentos.getEmergencias();
                console.log('loadEmergencias: dados recebidos:', data);
                const tbody = document.getElementById('tabela-emergencias');
                tbody.innerHTML = '';
                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-slate-500">Nenhuma emergência</td></tr>';
                    return;
                }
                data.forEach(a => {
                    const dataHora = a.dataHora ? new Date(a.dataHora).toLocaleString('pt-BR') : '-';
                    tbody.innerHTML += `<tr>
                        <td class="font-medium text-slate-700">${dataHora}</td>
                        <td class="text-slate-600">${a.colaboradorNome}</td>
                        <td class="text-slate-600">${a.sintomas || '-'}</td>
                        <td><span class="badge badge-danger">${a.gravidade}</span></td>
                    </tr>`;
                });
            } catch (err) {
                console.error('Erro ao carregar emergencias:', err);
            }
        }
        
        document.getElementById('form-atendimento').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Registrando...';
            try {
                const encaminhamentoVal = document.getElementById('atend-encaminhamento').value;
                const data = {
                    dataHora: document.getElementById('atend-data').value,
                    colaboradorMatricula: document.getElementById('atend-colab-matricula').value,
                    tipo: document.getElementById('atend-tipo').value,
                    sintomas: document.getElementById('atend-sintomas').value,
                    gravidade: document.getElementById('atend-gravidade').value,
                    conduta: document.getElementById('atend-conduta').value,
                    encaminhamento: encaminhamentoVal || null,
                    emergencia: document.getElementById('atend-tipo').value === 'EMERGENCIA'
                };
                console.log('Salvando atendimento:', data);
                const resultado = await Atendimentos.save(data);
                if (!resultado) {
                    showMessage('Erro ao registrar atendimento. Verifique a matrícula e tente novamente.', 'danger');
                    return;
                }
                showMessage('Atendimento registrado com sucesso!', 'success');
                hideModal('modal-atendimento');
                document.getElementById('form-atendimento').reset();
                // Aguarda ambas as atualizações antes de continuar
                await Promise.all([loadAtendimentos(), loadEmergencias()]);
            } catch (err) {
                console.error('Erro ao salvar:', err);
                showMessage('Erro inesperado ao registrar atendimento.', 'danger');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Registrar';
            }
        });
        
        function logout() { localStorage.removeItem('token'); window.location.replace('/login'); }
        if (localStorage.getItem('token')) {
            loadAtendimentos();
            loadEmergencias();
        } else {
            window.location.replace('/login');
        }
    </script>
</body>
</html>
