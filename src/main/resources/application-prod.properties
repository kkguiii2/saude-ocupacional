# ============================================================
# PERFIL DE PRODUÇÃO — application-prod.properties
# Ativado com: -Dspring.profiles.active=prod
# ou via variável: SPRING_PROFILES_ACTIVE=prod
# ============================================================

# -----------------------------------------------------------
# THYMELEAF — cache habilitado em produção
# -----------------------------------------------------------
spring.thymeleaf.cache=true

# -----------------------------------------------------------
# JWT — OBRIGATÓRIO em produção, sem fallback
# Se JWT_SECRET não estiver definido, a aplicação falhará
# -----------------------------------------------------------
jwt.secret=${JWT_SECRET}

# -----------------------------------------------------------
# LOGGING — nível mínimo em produção
# -----------------------------------------------------------
logging.level.com.industrial.saude=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.engine.jdbc.batch=ERROR

# -----------------------------------------------------------
# JPA — sem output de SQL em produção
# -----------------------------------------------------------
spring.jpa.show-sql=false

# -----------------------------------------------------------
# COMPRESSÃO HTTP — garantir habilitado
# -----------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/json,application/javascript
server.compression.min-response-size=1024

# -----------------------------------------------------------
# SESSÃO / HEADERS DE SEGURANÇA
# -----------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.error.include-stacktrace=never
server.error.include-message=never

# -----------------------------------------------------------
# ACTUATOR — detalhes só para administradores
# -----------------------------------------------------------
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMINISTRADOR
